name: CI

on:
  push:
  pull_request:

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-15
            python: "3.12"
            architecture: arm64
          - os: macos-15-intel
            python: "3.12"
            architecture: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify macOS host architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install native dependencies
        run: 'python -m pip install --require-hashes --no-deps --only-binary=:all: -r plugins/macos-computer-use/requirements.txt'
      - name: Compile runtime
        run: python -m compileall -q plugins/macos-computer-use/macos_cua
      - name: Validate shell launchers
        if: runner.os != 'Windows'
        run: bash -n plugins/macos-computer-use/scripts/*.sh
      - name: Run all tests
        run: python -m unittest discover -s tests -v && python -m unittest discover -s plugins/macos-computer-use/tests -v
        shell: bash
      - name: MCP runtime smoke test
        run: PYTHONPATH=plugins/macos-computer-use python -m macos_cua.server --self-test
        shell: bash
      - name: Verify automatic fallback first run
        if: runner.os == 'macOS'
        run: |
          data="$RUNNER_TEMP/zcode-fallback-first-run"
          MACOS_CUA_DATA_DIR="$data" /bin/bash plugins/macos-computer-use/scripts/run-mcp.sh </dev/null
          version="$(PYTHONPATH=plugins/macos-computer-use python -c 'from macos_cua import __version__; print(__version__)')"
          test -x "$data/venv-$version/bin/python3"
          shopt -s nullglob
          staging=("$data"/.venv-*.install.*)
          test "${#staging[@]}" -eq 0
      - name: Verify and launch the pinned Cua Driver release
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.12.6/checksums.txt -o /tmp/cua-driver-checksums.txt
          curl -fsSL https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.12.6/cua-driver-rs-0.12.6-darwin-universal.tar.gz -o /tmp/cua-driver-release.tar.gz
          echo "21486096e0c5901cafcaaf652144308abb3f088a2d9785941585a002c571233f  /tmp/cua-driver-checksums.txt" | shasum -a 256 -c -
          echo "c86d6a9ccb074e6e3bc17292adc31b9c76933c646cb2b52a7d8813429a5a6e6f  /tmp/cua-driver-release.tar.gz" | shasum -a 256 -c -
          grep -F "c86d6a9ccb074e6e3bc17292adc31b9c76933c646cb2b52a7d8813429a5a6e6f  cua-driver-rs-0.12.6-darwin-universal.tar.gz" /tmp/cua-driver-checksums.txt
          mkdir -p /tmp/cua-driver-release
          tar -xzf /tmp/cua-driver-release.tar.gz -C /tmp/cua-driver-release
          app=/tmp/cua-driver-release/cua-driver-rs-0.12.6-darwin-universal/CuaDriver.app
          binary="$app/Contents/MacOS/cua-driver"
          lipo "$binary" -verify_arch arm64 x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.trycua.driver"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "0.12.6"
          signing_info="$(codesign -dv --verbose=4 "$app" 2>&1)"
          grep -Fx "TeamIdentifier=YCK386LBJ7" <<<"$signing_info"
          grep -Fx "Authority=Developer ID Application: Cua AI, Inc. (YCK386LBJ7)" <<<"$signing_info"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute "$app"
          "$binary" --version | grep -F "0.12.6"
          /usr/bin/open -h 2>&1 | grep -F -- "--env"
          data="$RUNNER_TEMP/zcode-primary-first-run"
          unrelated_home="$RUNNER_TEMP/unrelated-cua-home"
          mkdir -p "$unrelated_home"
          mkdir -p "$data/installers"
          cp /tmp/cua-driver-release.tar.gz "$data/installers/cua-driver-rs-0.12.6-darwin-universal.tar.gz"
          HOME="$unrelated_home" MACOS_CUA_DATA_DIR="$data" /bin/bash plugins/macos-computer-use/scripts/run-cua-driver.sh --prepare-only
          test ! -e "$unrelated_home/.cua-driver"
          test ! -e "$unrelated_home/.cua-driver-rs"
          product_app="$data/cua-driver-app/v0.12.6/CuaDriver.app"
          product_binary="$product_app/Contents/MacOS/cua-driver"
          test -x "$product_binary"
          test "$product_app" != "/Applications/CuaDriver.app"
          product_signing_info="$(codesign -dv --verbose=4 "$product_app" 2>&1)"
          grep -Fx "TeamIdentifier=YCK386LBJ7" <<<"$product_signing_info"
          telemetry_status="$(env -u CUA_DRIVER_RS_TELEMETRY_ENABLED -u CUA_TELEMETRY_ENABLED CUA_DRIVER_TELEMETRY_HOME="$data/cua-telemetry" "$product_binary" telemetry status --json)"
          grep -Eq '"enabled"[[:space:]]*:[[:space:]]*false' <<<"$telemetry_status"
          grep -Eq '"source"[[:space:]]*:[[:space:]]*"persisted"' <<<"$telemetry_status"
          socket="$RUNNER_TEMP/cua-policy-proof.sock"
          CUA_DRIVER_RS_TELEMETRY_ENABLED=false CUA_DRIVER_RS_UPDATE_CHECK=false CUA_DRIVER_TELEMETRY_HOME="$data/cua-telemetry" "$product_binary" serve --socket "$socket" --permission-mode unrestricted --dangerously-bypass-approvals --no-permissions-gate >/tmp/cua-policy-proof.log 2>&1 &
          daemon_pid=$!
          cleanup_policy_proof() {
            "$product_binary" stop --socket "$socket" >/dev/null 2>&1 || true
            wait "$daemon_pid" 2>/dev/null || true
          }
          trap cleanup_policy_proof EXIT
          ready=0
          for attempt in {1..100}; do
            if status="$("$product_binary" status --socket "$socket" 2>/dev/null)"; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" = 1
          grep -F "permission mode: unrestricted" <<<"$status"
          grep -F "user policy: configured=false, active=false, valid=true" <<<"$status"
          grep -F "managed policy: configured=false, active=false, valid=true" <<<"$status"
          grep -F "session policy: configured=false, approved_at_startup=false, valid=true" <<<"$status"
          cleanup_policy_proof
          trap - EXIT

  fallback-python-compat:
    name: fallback CPython ${{ matrix.python }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.13t", "3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install exact native wheel closure
        run: 'python -m pip install --require-hashes --no-deps --only-binary=:all: -r plugins/macos-computer-use/requirements.txt'
      - name: Import native frameworks and self-test MCP
        run: |
          python -c 'import AppKit, ApplicationServices, Quartz'
          PYTHONPATH=plugins/macos-computer-use python -m macos_cua.server --self-test
